<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="8-YlQPEHQvZK656l4NUvbYM8G-IWPdO0ulhHwLJ3mWY" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamShield AI</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #dbeafe;
            border-radius: 12px;
            resize: none;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🛡️</div>

    <h1>ScamShield AI</h1>

    <p class="subtitle">
        AI-Powered Scam Message & Link Detection
    </p>

    <textarea id="message"
        placeholder="Paste your message or link here..."></textarea>

    <button onclick="analyzeMessage()">
        🔍 ANALYZE MESSAGE
    </button>

    <div id="result"></div>

    <div class="footer">
        Stay Safe • Think Before You Click
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
